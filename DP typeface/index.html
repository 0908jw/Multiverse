  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #f2f0eb; font-family: 'Courier New', monospace; }
  #app { display: flex; height: 100vh; }

  #panel {
    width: 220px; min-width: 220px; height: 100%;
    border-right: 1px solid #d0cdc6;
    display: flex; flex-direction: column;
    padding: 26px 18px 18px;
    background: #eae8e2;
    overflow-y: auto;
    flex-shrink: 0;
  }
  .tag   { font-size: 8px; letter-spacing: 0.16em; text-transform: uppercase; color: #8c887f; margin-bottom: 18px; }
  .title { font-family: ALTNadrey, Georgia, serif; font-size: 19px; font-weight: normal; color: #1a1714; line-height: 1.25; margin-bottom: 3px; }
  .sub   { font-size: 8px; letter-spacing: 0.08em; color: #8c887f; margin-bottom: 24px; }
  .rule  { height: 1px; background: #d0cdc6; margin-bottom: 18px; }

  #text-input {
    width: 100%; background: transparent; border: none;
    border-bottom: none;
    padding: 7px 0 6px;
    font-family: ALTNadrey, Georgia, serif; font-size: 16px;
    color: #1a1714; outline: none; caret-color: #1a1714;
    margin-bottom: 24px; resize: none; line-height: 1.6;

  }


  .sl-block { margin-bottom: 14px; }
  .sl-label { font-size: 8px; letter-spacing: 0.12em; text-transform: uppercase; color: #8c887f; margin-bottom: 6px; display: flex; justify-content: space-between; }
  .sl-label span { color: #1a1714; }
  input[type=range] { -webkit-appearance: none; width: 100%; height: 1px; background: #d0cdc6; outline: none; cursor: pointer; display: block; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 8px; height: 8px; background: #1a1714; border-radius: 50%; cursor: pointer; }
  input[type=range]::-moz-range-thumb     { width: 8px; height: 8px; background: #1a1714; border: none; border-radius: 50%; }

  /* Pause indicator */
  #pause-bar-wrap { margin-bottom: 18px; }
  #pause-bar-label { font-size: 8px; letter-spacing: 0.12em; text-transform: uppercase; color: #8c887f; margin-bottom: 6px; display: flex; justify-content: space-between; }
  #pause-track { width: 100%; height: 1px; background: #d0cdc6; position: relative; }
  #pause-fill  { height: 1px; background: #1a1714; width: 0%; transition: width 0.1s linear; }

  .footer { margin-top: auto; font-size: 8px; color: #8c887f; line-height: 2.2; padding-top: 10px; }
  .footer strong { display: block; font-weight: normal; letter-spacing: 0.08em; color: #5a5650; }

  #controls { margin-top: auto; }
  #hint { font-size: 8px; color: #8c887f; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 14px; }
  #canvas-wrap { flex: 1; height: 100%; position: relative; overflow: hidden; }
  canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
</style>

<body>
<div id="app">
  <div id="panel">
    <textarea rows="6" id="text-input" spellcheck="false" autocomplete="off" placeholder="Type here…">hi</textarea>

    <div id="controls">
      <div class="sl-block">
        <div class="sl-label">Longing</div>
        <input type="range" id="sl-size" min="0" max="100" value="0">
      </div>
      <div class="sl-block">
        <div class="sl-label">Thinking</div>
        <input type="range" id="sl-cols" min="1" max="6" value="3">
      </div>
      <div class="sl-block">
        <div class="sl-label">Missing</div>
        <input type="range" id="sl-bw" min="1" max="8" value="2">
      </div>
      <div class="sl-block">
        <div class="sl-label">Deleting</div>
        <input type="range" id="sl-spd" min="1" max="10" value="2">
      </div>

      <div id="pause-bar-wrap">
        <div id="pause-bar-label">Pause <span id="v-pause">0s</span></div>
        <div id="pause-track"><div id="pause-fill"></div></div>
      </div>

      <div id="hint">⌘S — export text </div>
    </div>
  </div>

  <div id="canvas-wrap"><canvas id="mainCanvas"></canvas></div>
</div>

<script>
const canvas = document.getElementById('mainCanvas');
const ctx    = canvas.getContext('2d');

let lastTypeMs  = Date.now();
let pauseAmount = 0; // 0..1, grows the longer you pause
let t = 0;
let needsRebuild = true;

// Typing rhythm tracking
let lastKeyMs    = Date.now();  // timestamp of previous keypress
let colFrozenY   = {};      // ci → frozen Y offset stamped at moment of typing
let colBirthT    = {};      // ci → t value when column was first created
let lastTypePulseMs = 0;    // ms of last keypress for pulse effect
let pulseActive     = false;
let colSpread    = 1.0;     // animated spread (1 = original form)

// Column data: [{x, heights: [{yCenter, maxH, frac}]}]
let colData = [];
let lastFrame = []; // snapshot of every drawn shape for SVG export

const DS = 1; // full resolution mask for accuracy
let mC, mX, mW, mH, maskData;

function getCols()  { return +document.getElementById('sl-cols').value; }
function getBarW()  { return +document.getElementById('sl-bw').value; }
function getSpeed()  { return +document.getElementById('sl-spd').value; }
function getLonging(){ return +document.getElementById('sl-size').value; }

function initBuffers() {
  mW = canvas.width;
  mH = canvas.height;
  mC = document.createElement('canvas');
  mC.width = mW; mC.height = mH;
  mX = mC.getContext('2d');
  needsRebuild = true;
}
function resizeCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  canvas.width  = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
  initBuffers();
}

// ── Noise ────────────────────────────────────────────────────────────────────
function hash(x, y, z) {
  const n = Math.sin((x||0)*127.1+(y||0)*311.7+(z||0)*74.7)*43758.5453;
  return n - Math.floor(n);
}
function vnoise(x, y) {
  const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
  const ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
  return ((hash(ix,iy)*2-1)*(1-ux)+(hash(ix+1,iy)*2-1)*ux)*(1-uy)+
         ((hash(ix,iy+1)*2-1)*(1-ux)+(hash(ix+1,iy+1)*2-1)*ux)*uy;
}

// ── Build mask + column data ──────────────────────────────────────────────────
function buildMask() {
  const W  = canvas.width, H = canvas.height;
  const raw_text = document.getElementById('text-input').value || 'hi';

  // Auto-fit font size so text always stays inside canvas,
  // accounting for Longing spread which fans columns outward.
  const longing   = getLonging() / 100;
  const spreadMul = 1.0 + longing * 1.5; // matches render drawX formula
  const margin    = 40; // px padding each side
  const lines     = raw_text.split('\n').filter(l => l.trim().length > 0);

  // Binary-search the largest fs where all lines fit width AND total height fits
  let fs = 8;
  for (let probe = 200; probe >= 1; probe = Math.floor(probe / 2)) {
    const candidate = fs + probe;
    mX.font = `${candidate}px ALTNadrey, Georgia, serif`;
    const maxW = Math.max(...lines.map(l => mX.measureText(l).width));
    const totalH = lines.length * candidate * 1.55;
    // The spread fan expands drawn x-positions by spreadMul from canvas center.
    // Worst case: a bar at canvas edge gets pushed further out.
    // Safe bound: text pixel width * spreadMul must fit in W - margin*2
    if (maxW * spreadMul <= W - margin * 2 && totalH <= H - margin * 2) {
      fs = candidate;
    }
    if (probe === 1) break;
  }

  mW = W; mH = H;
  mC.width = W; mC.height = H;
  mX.clearRect(0, 0, W, H);
  mX.font = `${fs}px ALTNadrey, Georgia, serif`;
  mX.fillStyle = '#000';

  // Split into lines, render each centred
  const lineH    = fs * 1.55;
  const totalH   = lines.length * lineH;
  const startY   = H/2 - totalH/2 + fs * 0.85;

  for (let li = 0; li < lines.length; li++) {
    const line = lines[li];
    const tw   = mX.measureText(line).width;
    mX.fillText(line, W/2 - tw/2, startY + li * lineH);
  }

  const imgData = mX.getImageData(0, 0, W, H).data;
  maskData = new Uint8Array(W * H);
  for (let i=0; i<W*H; i++) maskData[i] = imgData[i*4+3];

  // Build column data — preserve birth times and frozen positions for existing columns
  const step = getCols();
  const newColData = [];

  for (let cx = 0; cx < W; cx += step) {
    const col = { x: cx + step/2, runs: [] };
    let inRun = false, runStart = 0, peakA = 0, sumA = 0, count = 0;

    for (let cy = 0; cy < H; cy++) {
      const a = maskData[cy * W + Math.min(cx, W-1)];
      if (a > 18) {
        if (!inRun) { inRun=true; runStart=cy; peakA=0; sumA=0; count=0; }
        if (a > peakA) peakA = a;
        sumA += a; count++;
      } else {
        if (inRun) {
          inRun = false;
          const runEnd  = cy;
          const yCenter = (runStart + runEnd) / 2;
          const runH    = runEnd - runStart;
          col.runs.push({ yCenter, runH, frac: peakA/255, avgFrac: (sumA/count)/255 });
        }
      }
    }
    if (inRun) {
      col.runs.push({
        yCenter: (runStart+H)/2, runH: H-runStart,
        frac: peakA/255, avgFrac: (sumA/count)/255
      });
    }
    if (col.runs.length > 0) newColData.push(col);
  }

  // Match new columns to old by x-position — reuse birth times for existing columns
  const oldByX = {};
  for (let i = 0; i < colData.length; i++) {
    oldByX[Math.round(colData[i].x)] = i;
  }
  const newBirthT = {};
  for (let i = 0; i < newColData.length; i++) {
    const xKey = Math.round(newColData[i].x);
    const oldIdx = oldByX[xKey];
    // Carry over birth time if column existed before; else start fresh
    newBirthT[i] = (oldIdx !== undefined && colBirthT[oldIdx] !== undefined)
      ? colBirthT[oldIdx]
      : t;
  }
  colData   = newColData;
  colBirthT = newBirthT;
  // Clear frozen positions for columns that no longer exist; keep matching ones
  const newFrozen = {};
  for (let i = 0; i < colData.length; i++) {
    const xKey = Math.round(colData[i].x);
    const oldIdx = oldByX[xKey];
    if (oldIdx !== undefined && colFrozenY[oldIdx] !== undefined) {
      newFrozen[i] = colFrozenY[oldIdx];
    }
  }
  colFrozenY = newFrozen;
  needsRebuild = false;
}

// ── Render ───────────────────────────────────────────────────────────────────
function render() {
  const W = canvas.width, H = canvas.height;
  const bw    = getBarW();
  const pause = pauseAmount; // 0..1, very slow

  ctx.fillStyle = '#f2f0eb';
  ctx.fillRect(0, 0, W, H);
  if (!colData.length) return;

  ctx.fillStyle = '#1a1714';
  lastFrame = [];

  const W2      = W / 2;
  const longing = getLonging() / 100; // 0..1 — widens gaps between columns
  for (let ci = 0; ci < colData.length; ci++) {
    const col    = colData[ci];
    // Spread columns outward from canvas center: longing adds extra gap
    const drawX  = W2 + (col.x - W2) * (colSpread + longing * 1.5);

    for (let ri = 0; ri < col.runs.length; ri++) {
      const run  = col.runs[ri];
      const { yCenter: yCenterBase, runH, frac } = run;
      const yCenter = yCenterBase;

      // ── OSCILLATION: each bar physically moves up and down independently ──
      // Like typewriter keys trembling — each has its own period and phase.
      // Period 2–6 seconds. Amplitude scales with frac (core bars move most).
      const oscPeriod = 120 + hash(ci * 0.11, ri * 0.37, 1) * 240;
      const oscPhase  = hash(ci * 0.13, ri * 0.29, 2) * Math.PI * 2;
      const oscRaw    = Math.sin((t / oscPeriod) * Math.PI * 2 + oscPhase); // -1..1

      // Energy: 0 at all sliders min, 1 at max. Controls how much the bars deviate
      // from the pure letterform. At energy=0 → perfectly still, exact runH.
      const energy    = Math.min(1, (getBarW() - 1) / 7 * 0.4 + getSpeed() / 10 * 0.4 + getLonging() / 100 * 0.2);
      const ampBase   = (6 + hash(ci * 0.17, ri * 0.53, 3) * 12) * energy;
      const frozen  = colFrozenY[ci];
      const liveY   = oscRaw * ampBase * (1 + pause * frac * 2.5);
      const oscY    = (frozen !== undefined) ? frozen * energy : liveY;

      // ── DOT → BAR: each bar is born as a dot, stretches to full height ───
      // birthProgress 0→1 over ~60 frames (1s) with stagger per column
      const birthT    = colBirthT[ci] !== undefined ? colBirthT[ci] : t;
      const stagger   = hash(ci * 0.31, ri * 0.47, 5) * 80; // 0–80 frame stagger
      const age       = Math.max(0, t - birthT - stagger);
      const birthProg = Math.min(1.0, age / 300); // ~5s to full bar
      const easedBirth = birthProg * birthProg * (3 - 2 * birthProg); // smoothstep

      // ── BAR HEIGHT: starts as dot (0), stretches to full runH ───────────
      const noiseUp   = 0.5 + 0.5 * vnoise(ci * 0.21 + 3.1, ri * 0.8);
      const noiseDown = 0.5 + 0.5 * vnoise(ci * 0.19 + 7.4, ri * 0.9 + 1.0);
      // At energy=0: bars sit exactly at runH (no asymmetric stretch, no pause growth)
      const halfUp    = (runH / 2) * easedBirth * (1.0 + pause * frac * 5.0 * noiseUp * energy);
      const halfDown  = (runH / 2) * easedBirth * (1.0 + pause * frac * 5.0 * noiseDown * energy);
      const barTop    = (yCenter + oscY) - halfUp;
      const barH      = halfUp + halfDown;

      // ── BAR WIDTH ────────────────────────────────────────────────────────
      const barWidth  = Math.max(0.6, bw * (0.2 + frac * 0.55));

      // ── TYPING PULSE: random opacity flicker on recent keypress ─────────
      let pulseAlpha = 0.0;
      if (pulseActive) {
        const pulseAge = (Date.now() - lastTypePulseMs) / 1000;
        if (pulseAge < 0.4) {
          const pulseRand = hash(ci * 0.41, ri * 0.67, Math.floor(t * 0.5));
          pulseAlpha = (1.0 - pulseAge / 0.4) * pulseRand * 0.45;
        } else {
          pulseActive = false;
        }
      }

      // ── DRAW ─────────────────────────────────────────────────────────────
      const opacity = Math.min(0.97, (0.6 + frac * 0.35) + pulseAlpha);
      ctx.globalAlpha = opacity;
      if (barH < 1) {
        const r = Math.max(0.8, barWidth);
        ctx.beginPath();
        ctx.arc(drawX, yCenter + oscY, r, 0, Math.PI * 2);
        ctx.fill();
        lastFrame.push({ type:'circle', cx:drawX, cy:yCenter+oscY, r, opacity });
      } else {
        ctx.fillRect(drawX - barWidth / 2, barTop, barWidth, barH);
        lastFrame.push({ type:'rect', x:drawX - barWidth/2, y:barTop, w:barWidth, h:barH, opacity });
      }


    }
  }

  // ── BLEED: ghost hairs above/below at long pause ─────────────────────────
  if (pause > 0.6) {
    const bleedAlpha = (pause - 0.6) * 0.07;
    ctx.fillStyle   = '#1a1714';
    for (const col of colData) {
      for (const run of col.runs) {
        if (run.frac < 0.5) continue;
        const ghostH = run.runH * run.frac * pause * 9;
        const gw     = Math.max(0.3, bw * 0.15);
        ctx.globalAlpha = bleedAlpha * run.frac;
        ctx.fillRect(col.x - gw/2, run.yCenter - ghostH/2, gw, ghostH);
      }
    }
  }

  ctx.globalAlpha = 1;
}

// ── Loop ─────────────────────────────────────────────────────────────────────
function loop() {
  // Pause grows from 0 → 1 over ~10 seconds of no typing
  // Resets to 0 immediately on keypress
  const msIdle = Date.now() - lastTypeMs;
  const prev   = pauseAmount;

  if (msIdle < 800) {
    pauseAmount = 0;
  } else {
    // Very slow growth — reaches 1.0 after 40 seconds
    const raw = Math.min(1.0, (msIdle - 2000) / 60000);
    // Square ease — visible after ~10s, full stretch after ~60s of stillness
    pauseAmount = raw * raw;
  }

  // Update pause indicator
  const pct    = Math.round(pauseAmount * 100);
  const secIdle = Math.max(0, (Date.now() - lastTypeMs - 2000) / 1000);
  document.getElementById('pause-fill').style.width = pct + '%';
  document.getElementById('v-pause').textContent    = secIdle.toFixed(1) + 's';

  if (Math.abs(pauseAmount - prev) > 0.001) {
    // No rebuild needed — pause only affects render, not mask
  }

  t += getSpeed() * 0.08;  // speed slider: 0.08–0.8 per frame (slow)

  // Spread driven by live gap since last keypress.
  // 0–500ms: tight (1.0). 500ms–5s: opens to 1.6. Very slow drift.
  // Spread: opens extremely slowly after last keypress (0→full over ~20s)
  // Square ease makes it start imperceptibly then accelerate gently
  const msSinceKey = Date.now() - lastKeyMs;
  const rawDelay   = Math.min(1.0, Math.max(0, (msSinceKey - 800) / 20000));
  const spreadGoal = 1.0 + rawDelay * rawDelay * 0.7;
  colSpread += (spreadGoal - colSpread) * 0.0008;

  if (needsRebuild) buildMask();
  render();
  requestAnimationFrame(loop);
}

// ── UI ───────────────────────────────────────────────────────────────────────
['size','cols','bw'].forEach(key => {
  document.getElementById(`sl-${key}`).addEventListener('input', () => { needsRebuild = true; });
});
// speed slider has no label to update

document.getElementById('text-input').addEventListener('input', () => {
  lastTypeMs  = Date.now();
  pauseAmount = 0;

  // Word-wrap at ~38 chars — like a narrow document column
  const el    = document.getElementById('text-input');
  const wrap  = 38;
  const lines = el.value.split('\n');
  const reflowed = [];
  for (const line of lines) {
    if (line.length <= wrap) { reflowed.push(line); continue; }
    // Break at last space before wrap point
    let remaining = line;
    while (remaining.length > wrap) {
      let cut = wrap;
      while (cut > 0 && remaining[cut] !== ' ') cut--;
      if (cut === 0) cut = wrap; // no space found, hard break
      reflowed.push(remaining.slice(0, cut));
      remaining = remaining.slice(cut).replace(/^ /, '');
    }
    if (remaining.length) reflowed.push(remaining);
  }
  const newVal = reflowed.join('\n');
  if (newVal !== el.value) {
    const pos = el.selectionStart;
    el.value  = newVal;
    el.selectionStart = el.selectionEnd = pos;
  }

  needsRebuild = true;
});

// Also reset pause on any keydown in the input
document.getElementById('text-input').addEventListener('keydown', () => {
  const now    = Date.now();
  const gap    = now - lastKeyMs;
  lastKeyMs    = now;
  lastTypeMs   = now;
  pauseAmount  = 0;

  // Stamp frozen Y for columns near the current caret position.
  // Each column captures its current oscillation value and holds it.
  const el       = document.getElementById('text-input');
  const caret    = el.selectionStart || 0;
  const textLen  = (el.value || '').length;
  const caretFrac = Math.min(1, caret / Math.max(1, textLen));
  const reach     = 0.3;
  const nCols     = colData.length;
  for (let ci2 = 0; ci2 < nCols; ci2++) {
    const barFrac = ci2 / Math.max(1, nCols - 1);
    const dist    = Math.abs(barFrac - caretFrac);
    if (dist < reach) {
      // Compute this column's current oscY and freeze it
      // (same formula as render — single run [0] as proxy)
      const run0   = colData[ci2] && colData[ci2].runs[0];
      if (run0) {
        const oscPeriod = 120 + hash(ci2 * 0.11, 0 * 0.37, 1) * 240;
        const oscPhase  = hash(ci2 * 0.13, 0 * 0.29, 2) * Math.PI * 2;
        const oscRaw    = Math.sin((t / oscPeriod) * Math.PI * 2 + oscPhase);
        const ampBase   = 6 + hash(ci2 * 0.17, 0 * 0.53, 3) * 12;
        colFrozenY[ci2] = oscRaw * ampBase;
      }
    }
  }

  // Snap bars back to original form on every keypress
  colSpread = 1.0;
  lastTypePulseMs = now;
  pulseActive = true;
});

document.addEventListener('keydown', e => {
  if ((e.key==='s'||e.key==='S') && (e.metaKey || e.ctrlKey)) {
    e.preventDefault();
    // Export exactly what's on screen — read from lastFrame snapshot
    const W = canvas.width, H = canvas.height;
    const parts = [`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}">`];
    for (const s of lastFrame) {
      if (s.type === 'circle') {
        parts.push(`<circle cx="${s.cx.toFixed(2)}" cy="${s.cy.toFixed(2)}" r="${s.r.toFixed(2)}" fill="#1a1714" opacity="${s.opacity.toFixed(3)}"/>`);
      } else {
        parts.push(`<rect x="${s.x.toFixed(2)}" y="${s.y.toFixed(2)}" width="${s.w.toFixed(2)}" height="${s.h.toFixed(2)}" fill="#1a1714" opacity="${s.opacity.toFixed(3)}"/>`);
      }
    }
    parts.push('</svg>');
    const blob = new Blob([parts.join('')], {type:'image/svg+xml'});
    const a = document.createElement('a');
    a.download = 'copy.svg';
    a.href = URL.createObjectURL(blob);
    a.click();
  }
});

window.addEventListener('resize', () => { resizeCanvas(); needsRebuild = true; });

// Wait for custom font to load before first render
document.fonts.load(`72px ALTNadrey`).then(() => {
  resizeCanvas();
  loop();
}).catch(() => {
  resizeCanvas();
  loop();
});
</script>
</body>
